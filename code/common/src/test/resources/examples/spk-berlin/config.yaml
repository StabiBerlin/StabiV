input:
  includes:
    - valid
    - invalid

validation:
  # the number of execution threads to validate images of a directory in parallel (default 4)
  parallelThreads: 4

  imageRules:
    # JHove wellformed
    - message: JHove must detect file as wellformed
      severity: error
      context: $.jhove
      condition:
        property: $.wellformed
        assert: equal
        value: true

    # JHove valid
    - message: JHove must detect file as valid
      severity: error
      context: $.jhove
      condition:
        property: $.valid
        assert: equal
        value: true

    # Exiftool reports no warning
    - message: Exiftool reports warning
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Warning
          assert: exists

    # IFD
    - message: must have exactly one IFD
      severity: error
      context: $.exiftool
      condition:
        property: $.TIFF.IFD
        assert: occurrences
        value: 1

    # ImageWidth
    - message: ImageWidth must be positive integer
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.ImageWidth
            assert: greaterThan
            value: 0
          - property: $.ImageWidth
            assert: isInteger

    # ImageLength
    - message: ImageHeight must be positive integer
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.ImageHeight
            assert: greaterThan
            value: 0
          - property: $.ImageHeight
            assert: isInteger

    # PhotometricInterpretation
    - message: PhotometricInterpretation must be RGB or BlackIsZero
      severity: error
      context: $.exiftool
      condition:
        property: $..PhotometricInterpretation
        assert: oneOf
        value:
          - RGB
          - BlackIsZero

    # BitsPerSample
    - message: BitsPerSample must be all 8 or all 16
      severity: error
      context: $.exiftool
      condition:
        property: $..BitsPerSample
        assert: oneOf
        value:
          - "8"
          - "8 8 8"
          - "16"
          - "16 16 16"

    # Compression
    - message: Compression must be Uncompressed
      severity: error
      context: $.exiftool
      condition:
        property: $..Compression
        assert: equal
        value: Uncompressed

    # StripOffsets
    - message: StripOffsets must be positive integer
      severity: error
      context: $.exiftool
      condition:
        and:
          - property: $..StripOffsets
            assert: greaterThan
            value: 0
          - property: $..StripOffsets
            assert: isInteger

    # RowsPerStrip
    - message: RowsPerStrip must be positive integer
      severity: error
      context: $.exiftool
      condition:
        and:
          - property: $..RowsPerStrip
            assert: greaterThan
            value: 0
          - property: $..RowsPerStrip
            assert: isInteger

    # StripByteCounts
    - message: StripByteCounts must be positive integer
      severity: error
      context: $.exiftool
      condition:
        and:
          - property: $..StripByteCounts
            assert: greaterThan
            value: 0
          - property: $..StripByteCounts
            assert: isInteger

    # XResolution
    - message: XResolution must be either 300, 400 or 600
      severity: error
      context: $.exiftool
      condition:
        property: $..XResolution
        assert: oneOf
        value:
          - 300
          - 400
          - 600

    # YResolution
    - message: YResolution must be either 300, 400 or 600
      severity: error
      context: $.exiftool
      condition:
        property: $..YResolution
        assert: oneOf
        value:
          - 300
          - 400
          - 600

    # ResolutionUnit
    - message: ResolutionUnit must be inches
      severity: error
      context: $.exiftool
      condition:
        property: $..ResolutionUnit
        assert: equal
        value: inches

    # Make
    - message: Make must not be empty
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Make
          assert: isEmpty

    # Model
    - message: Model must not be empty
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Model
          assert: isEmpty

    # Software
    - message: Software must not be empty
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Software
          assert: isEmpty

    # Artist
    - message: Artist must not be empty
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Artist
          assert: isEmpty

    # ICC Profile
    - message: ICC profile required
      severity: error
      context: $.exiftool
      condition:
        property: $..ICC_Profile
        assert: occurrences
        value: 1

    # SerialNumber
    - message: SerialNumber required
      severity: error
      context: $.exiftool
      condition:
        or:
          - not:
              property: $..ExifIFD.SerialNumber
              assert: isEmpty
          - not:
              property: $..XMP.SerialNumber
              assert: isEmpty

    # SubfileType
    - message: SubfileType must be 'Full-resolution image' if defined
      severity: error
      context: $.exiftool
      condition:
        or:
          - not:
              property: $..SubfileType
              assert: exists
          - property: $..SubfileType
            assert: equal
            value: Full-resolution image

    # FillOrder
    - message: FillOrder must be 'Normal' image if defined
      severity: error
      context: $.exiftool
      condition:
        or:
          - not:
              property: $..FillOrder
              assert: exists
          - property: $..FillOrder
            assert: equal
            value: Normal

    # ImageDescription
    - message: ImageDescription must not be empty if defined
      severity: error
      context: $.exiftool
      condition:
        or:
          - not:
              property: $..ImageDescription
              assert: exists
          - not:
              property: $..ImageDescription
              assert: isEmpty

    # Orientation
    - message: Orientation must be 'Horizontal (normal)' if defined
      severity: error
      context: $.exiftool
      condition:
        or:
          - not:
              property: $..Orientation
              assert: exists
          - property: $..Orientation
            assert: equal
            value: Horizontal (normal)

    # SamplesPerPixel
    - message: SamplesPerPixel must be 1 or 3
      severity: error
      context: $.exiftool
      condition:
        property: $..SamplesPerPixel
        assert: oneOf
        value:
          - 1
          - 3

    # PlanarConfiguration
    - message: PlanarConfiguration must be 'Chunky' if defined
      severity: error
      context: $.exiftool
      condition:
        or:
          - not:
              property: $..PlanarConfiguration
              assert: exists
          - property: $..PlanarConfiguration
            assert: equal
            value: Chunky

    # ModifyDate
    - message: ModifyDate must be formatted as 'YYYY:MM:DD HH:MM:SS' if defined
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.ModifyDate
              assert: exists
          - property: $.ModifyDate
            assert: matches
            value: ^\d\d\d\d:\d\d:\d\d \d\d:\d\d:\d\d$

    # WhiteBalance
    - message: WhiteBalance must be Auto or Manual
      severity: error
      context: $.exiftool
      condition:
        property: $..WhiteBalance
        assert: oneOf
        value:
          - Auto
          - Manual

    # Copyright
    - message: Copyright must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Copyright
          assert: exists

    # XMP Rights
    - message: XMP Rights must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..XMP.Rights
          assert: exists

    # OldSubfileType
    - message: OldSubfileType must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..OldSubfileType
          assert: exists

    # Thresholding
    - message: Thresholding must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Thresholding
          assert: exists

    # CellWidth
    - message: CellWidth must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..CellWidth
          assert: exists

    # CellLength
    - message: CellLength must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..CellLength
          assert: exists

    # FreeOffsets
    - message: FreeOffsets must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..FreeOffsets
          assert: exists

    # FreeByteCounts
    - message: FreeByteCounts must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..FreeByteCounts
          assert: exists

    # HostComputer
    - message: HostComputer must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..HostComputer
          assert: exists

    # ColorMap
    - message: ColorMap must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..ColorMap
          assert: exists

    # ExtraSamples
    - message: ExtraSamples must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..ExtraSamples
          assert: exists

output:
  csv:
    path: output.csv
    columns:
      - label: JHove wellformed
        property: $.jhove.wellformed
      - label: JHove valid
        property: $.jhove.valid
      - label: PhotometricInterpretation
        property: $.exiftool.TIFF.IFD[0].PhotometricInterpretation
      - label: Compression
        property: $.exiftool.TIFF.IFD[0].Compression
      - label: Artist
        property: $.exiftool.TIFF.IFD[0].Artist
