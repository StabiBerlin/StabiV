input:
  includes:
    - "**"
  excludes:
    - "config.yaml"
    - "**.csv"
    - "**.xlsx"
    - ".~lock*"
    - "**.sha1"
    - "**.gitignore"

processing:
  threads: 4
  checksumAlgorithm: SHA-1

validation:
  directoryRules:
    consistentProperties:
      - label: PhotometricInterpretation
        property: $.exiftool.TIFF.IFD[0].PhotometricInterpretation
        severity: error
        reportColumn: true

      - label: BitsPerSample
        property: $.exiftool.TIFF.IFD[0].BitsPerSample
        severity: warning
        reportColumn: true

    consecutiveNumbering:
      filenameRegExp: "^(\\d{8})\\.tif$"
      filenameTemplate: "%08d.tif"
      numberMatchGroup: 1
      startNumber: 1
      severity: error

    propertyDeviations:
      # max image width deviation
      - label: ImageWidth
        property: $.exiftool.TIFF.IFD[0].ImageWidth
        reportColumn: true
        condition:
          severity: warning
          aggregate: average
          maxDeviation: 10
          inPercent: false
        additionalSlices:
          - from: 1
            to: 3
            reversed: false
            condition:
              severity: error
              aggregate: average
              maxDeviation: 10
              inPercent: false
          - from: 1
            to: 3
            reversed: true
            condition:
              severity: error
              aggregate: average
              maxDeviation: 10
              inPercent: false

      # max image height deviation
      - label: ImageHeight
        property: $.exiftool.TIFF.IFD[0].ImageHeight
        reportColumn: true
        condition:
          severity: warning
          aggregate: average
          maxDeviation: 10
          inPercent: false
        additionalSlices:
          - from: 1
            to: 3
            reversed: false
            condition:
              severity: error
              aggregate: average
              maxDeviation: 10
              inPercent: false
          - from: 1
            to: 3
            reversed: true
            condition:
              severity: error
              aggregate: average
              maxDeviation: 10
              inPercent: false

  imageRules:
    # JHove wellformed
    - message: JHove must detect file as wellformed
      severity: error
      reportColumns:
        - label: JHove wellformed
          property: $.jhove.wellformed
      context: $.jhove
      condition:
        property: $.wellformed
        assert: equal
        value: true

    # JHove valid
    - message: JHove must detect file as valid
      severity: error
      reportColumns:
        - label: JHove valid
          property: $.jhove.valid
      context: $.jhove
      condition:
        property: $.valid
        assert: equal
        value: true

    # Exiftool reports no warning
    - message: Exiftool reports warning
      severity: error
      reportColumns:
        - label: Exiftool warning
          property: $.exiftool..Warning
      context: $.exiftool
      condition:
        not:
          property: $..Warning
          assert: exists

    # TIF format
    - message: Image must be a TIF file
      severity: error
      reportColumns:
        - label: FileType
          property: $.exiftool..FileType
      context: $.exiftool
      condition:
        property: $..FileType
        assert: equal
        value: TIFF

    # IFD
    - message: must have exactly one IFD
      severity: error
      reportColumns:
        - label: Number of IFDs
          property: $.exiftool.TIFF.IFD.length()
      context: $.exiftool
      condition:
        property: $.TIFF.IFD
        assert: occurrences
        value: 1

    # ImageWidth
    - message: ImageWidth must be positive integer
      severity: error
      reportColumns:
        - label: ImageWidth
          property: $.exiftool.TIFF.IFD[0].ImageWidth
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.ImageWidth
            assert: greaterThan
            value: 0
          - property: $.ImageWidth
            assert: isInteger

    # ImageLength
    - message: ImageHeight must be positive integer
      severity: error
      reportColumns:
        - label: ImageHeight
          property: $.exiftool.TIFF.IFD[0].ImageHeight
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.ImageHeight
            assert: greaterThan
            value: 0
          - property: $.ImageHeight
            assert: isInteger

    # PhotometricInterpretation
    - message: PhotometricInterpretation must be RGB or BlackIsZero
      severity: error
      reportColumns:
        - label: PhotometricInterpretation
          property: $.exiftool.TIFF.IFD[0].PhotometricInterpretation
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.PhotometricInterpretation
        assert: oneOf
        value:
          - BlackIsZero
          - RGB

    # BitsPerSample
    - message: BitsPerSample must be all 8 or all 16
      severity: error
      reportColumns:
        - label: BitsPerSample
          property: $.exiftool.TIFF.IFD[0].BitsPerSample
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.BitsPerSample
        assert: oneOf
        value:
          - "8"
          - "8 8 8"
          - "16"
          - "16 16 16"

    # Compression
    - message: Compression must be Uncompressed
      severity: error
      reportColumns:
        - label: Compression
          property: $.exiftool.TIFF.IFD[0].Compression
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.Compression
        assert: equal
        value: Uncompressed

    # StripOffsets
    - message: StripOffsets must be positive integer
      severity: error
      reportColumns:
        - label: StripOffsets
          property: $.exiftool.TIFF.IFD[0].StripOffsets
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.StripOffsets
            assert: greaterThan
            value: 0
          - property: $.StripOffsets
            assert: isInteger

    # RowsPerStrip
    - message: RowsPerStrip must be positive integer
      severity: error
      reportColumns:
        - label: RowsPerStrip
          property: $.exiftool.TIFF.IFD[0].RowsPerStrip
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.RowsPerStrip
            assert: greaterThan
            value: 0
          - property: $.RowsPerStrip
            assert: isInteger

    # StripByteCounts
    - message: StripByteCounts must be positive integer
      severity: error
      reportColumns:
        - label: StripByteCounts
          property: $.exiftool.TIFF.IFD[0].StripByteCounts
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.StripByteCounts
            assert: greaterThan
            value: 0
          - property: $.StripByteCounts
            assert: isInteger

    # XResolution
    - message: XResolution must be either 300, 400 or 600
      severity: error
      reportColumns:
        - label: XResolution
          property: $.exiftool.TIFF.IFD[0].XResolution
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.XResolution
        assert: oneOf
        value:
          - 300
          - 400
          - 600

    # YResolution
    - message: YResolution must be either 300, 400 or 600
      severity: error
      reportColumns:
        - label: YResolution
          property: $.exiftool.TIFF.IFD[0].YResolution
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.YResolution
        assert: oneOf
        value:
          - 300
          - 400
          - 600

    # XResolution = YResolution
    - message: XResolution must be the same as YResolution
      severity: error
      reportColumns:
        - label: XResolution
          property: $.exiftool.TIFF.IFD[0].XResolution
        - label: YResolution
          property: $.exiftool.TIFF.IFD[0].YResolution
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.XResolution
        assert: equalsProperty
        value: $.YResolution

    # ResolutionUnit
    - message: ResolutionUnit must be inches
      severity: error
      reportColumns:
        - label: ResolutionUnit
          property: $.exiftool.TIFF.IFD[0].ResolutionUnit
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.ResolutionUnit
        assert: equal
        value: inches

    # Make
    - message: Make must not be empty
      severity: error
      reportColumns:
        - label: Make
          property: $.exiftool.TIFF.IFD[0].Make
      context: $.exiftool.TIFF.IFD[0]
      condition:
        not:
          property: $.Make
          assert: isEmpty

    # Model
    - message: Model must not be empty
      severity: error
      reportColumns:
        - label: Model
          property: $.exiftool.TIFF.IFD[0].Model
      context: $.exiftool.TIFF.IFD[0]
      condition:
        not:
          property: $.Model
          assert: isEmpty

    # Software
    - message: Software must not be empty
      severity: error
      reportColumns:
        - label: Software
          property: $.exiftool.TIFF.IFD[0].Software
      context: $.exiftool.TIFF.IFD[0]
      condition:
        not:
          property: $.Software
          assert: isEmpty

    # Artist
    - message: Artist must not be empty
      severity: error
      reportColumns:
        - label: Artist
          property: $.exiftool.TIFF.IFD[0].Artist
      context: $.exiftool.TIFF.IFD[0]
      condition:
        not:
          property: $.Artist
          assert: isEmpty

    # ICC Profile
    - message: ICC profile required
      severity: error
      reportColumns:
        - label: ICC Profile Description
          property: $.exiftool.TIFF.IFD[0].ICC_Profile.ProfileDescription
      context: $.exiftool
      condition:
        property: $..ICC_Profile
        assert: occurrences
        value: 1

    # SerialNumber
    - message: SerialNumber required
      severity: error
      reportColumns:
        - label: SerialNumber (ExifIFD)
          property: $.exiftool.TIFF.IFD[0].ExifIFD.SerialNumber
        - label: SerialNumber (XMP)
          property: $.exiftool.TIFF.IFD[0].XMP.SerialNumber
      context: $.exiftool
      condition:
        or:
          - not:
              property: $..ExifIFD.SerialNumber
              assert: isEmpty
          - not:
              property: $..XMP.SerialNumber
              assert: isEmpty

    # SubfileType
    - message: SubfileType must be 'Full-resolution image' if defined
      severity: error
      reportColumns:
        - label: SubfileType
          property: $.exiftool.TIFF.IFD[0].SubfileType
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.SubfileType
              assert: exists
          - property: $.SubfileType
            assert: equal
            value: Full-resolution image

    # FillOrder
    - message: FillOrder must be 'Normal' image if defined
      severity: error
      reportColumns:
        - label: FillOrder
          property: $.exiftool.TIFF.IFD[0].FillOrder
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.FillOrder
              assert: exists
          - property: $.FillOrder
            assert: equal
            value: Normal

    # ImageDescription
    - message: ImageDescription must not be empty if defined
      severity: error
      reportColumns:
        - label: ImageDescription
          property: $.exiftool.TIFF.IFD[0].ImageDescription
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.ImageDescription
              assert: exists
          - not:
              property: $.ImageDescription
              assert: isEmpty

    # Orientation
    - message: Orientation must be 'Horizontal (normal)' if defined
      severity: error
      reportColumns:
        - label: Orientation
          property: $.exiftool.TIFF.IFD[0].Orientation
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.Orientation
              assert: exists
          - property: $.Orientation
            assert: equal
            value: Horizontal (normal)

    # SamplesPerPixel
    - message: SamplesPerPixel must be 1 or 3
      severity: error
      reportColumns:
        - label: SamplesPerPixel
          property: $.exiftool.TIFF.IFD[0].SamplesPerPixel
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.SamplesPerPixel
        assert: oneOf
        value:
          - 1
          - 3

    # PlanarConfiguration
    - message: PlanarConfiguration must be 'Chunky' if defined
      severity: error
      reportColumns:
        - label: PlanarConfiguration
          property: $.exiftool.TIFF.IFD[0].PlanarConfiguration
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.PlanarConfiguration
              assert: exists
          - property: $.PlanarConfiguration
            assert: equal
            value: Chunky

    # ModifyDate
    - message: ModifyDate must be formatted as 'YYYY:MM:DD HH:MM:SS' if defined
      severity: error
      reportColumns:
        - label: ModifyDate
          property: $.exiftool.TIFF.IFD[0].ModifyDate
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.ModifyDate
              assert: exists
          - property: $.ModifyDate
            assert: matches
            value: ^\d\d\d\d:\d\d:\d\d \d\d:\d\d:\d\d$

    # WhiteBalance
    - message: WhiteBalance must be Auto or Manual
      severity: error
      reportColumns:
        - label: WhiteBalance
          property: $.exiftool.TIFF.IFD[0].WhiteBalance
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.WhiteBalance
        assert: oneOf
        value:
          - Auto
          - Manual

    # Copyright
    - message: Copyright must not be defined
      severity: error
      reportColumns:
        - label: Copyright
          property: $.exiftool..Copyright
      context: $.exiftool
      condition:
        not:
          property: $..Copyright
          assert: exists

    # XMP Rights
    - message: XMP Rights must not be defined
      severity: error
      reportColumns:
        - label: XMP Rights
          property: $.exiftool..XMP.Rights
      context: $.exiftool
      condition:
        not:
          property: $..XMP.Rights
          assert: exists

    # OldSubfileType
    - message: OldSubfileType must not be defined
      severity: error
      reportColumns:
        - label: OldSubfileType
          property: $.exiftool..OldSubfileType
      context: $.exiftool
      condition:
        not:
          property: $..OldSubfileType
          assert: exists

    # Thresholding
    - message: Thresholding must not be defined
      severity: error
      reportColumns:
        - label: Thresholding
          property: $.exiftool..Thresholding
      context: $.exiftool
      condition:
        not:
          property: $..Thresholding
          assert: exists

    # CellWidth
    - message: CellWidth must not be defined
      severity: error
      reportColumns:
        - label: CellWidth
          property: $.exiftool..CellWidth
      context: $.exiftool
      condition:
        not:
          property: $..CellWidth
          assert: exists

    # CellLength
    - message: CellLength must not be defined
      severity: error
      reportColumns:
        - label: CellLength
          property: $.exiftool..CellLength
      context: $.exiftool
      condition:
        not:
          property: $..CellLength
          assert: exists

    # FreeOffsets
    - message: FreeOffsets must not be defined
      severity: error
      reportColumns:
        - label: FreeOffsets
          property: $.exiftool..FreeOffsets
      context: $.exiftool
      condition:
        not:
          property: $..FreeOffsets
          assert: exists

    # FreeByteCounts
    - message: FreeByteCounts must not be defined
      severity: error
      reportColumns:
        - label: FreeByteCounts
          property: $.exiftool..FreeByteCounts
      context: $.exiftool
      condition:
        not:
          property: $..FreeByteCounts
          assert: exists

    # HostComputer
    - message: HostComputer must not be defined
      severity: error
      reportColumns:
        - label: HostComputer
          property: $.exiftool..HostComputer
      context: $.exiftool
      condition:
        not:
          property: $..HostComputer
          assert: exists

    # ColorMap
    - message: ColorMap must not be defined
      severity: error
      reportColumns:
        - label: ColorMap
          property: $.exiftool..ColorMap
      context: $.exiftool
      condition:
        not:
          property: $..ColorMap
          assert: exists

    # ExtraSamples
    - message: ExtraSamples must not be defined
      severity: error
      reportColumns:
        - label: ExtraSamples
          property: $.exiftool..ExtraSamples
      context: $.exiftool
      condition:
        not:
          property: $..ExtraSamples
          assert: exists

output:
  checksum:
    filename: ${directory}.sha1
    lineFormat: ${checksum} *${filename}
  report:
    csvPath: output.csv
    excelPath: output.xlsx
    columns:
      - label: DateTimeOriginal
        property: $.exiftool.TIFF.IFD[0].DateTimeOriginal
