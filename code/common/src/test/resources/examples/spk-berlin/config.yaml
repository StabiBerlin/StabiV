# ---
# Input Options
#
# Specify which directories and files to process, and which directories and files to ignore
input:
  # ---
  # Include Patterns
  #
  # List all directories or files that are supposed to be validated. Relative paths are resolved relative to the location of this
  # configuration file. If a directory is listed, all of its contents are validated, including any subdirectories. If a pattern is listed,
  # subdirectories are only processed if the directory path matches the pattern. For example, the pattern `directory/*.tif` only matches
  # files with the "tif" extension, and thus, subdirectories are skipped. In contrast, the pattern `directory/*` matches any files or
  # subdirectories, and thus, subdirectories are also validated.
  #
  # Patterns can be defined via the "glob" syntax. Single asterisks (*) match any characters without crossing directory boundaries. Double
  # asterisks (**) match any characters crossing directory boundings. More details can be found here:
  # https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/nio/file/FileSystem.html#getPathMatcher(java.lang.String)
  #
  # For Example:
  #
  # includes:
  #  - /path/to/directory
  #  - /path/to/file.tif
  #  - /all/tif/files/*.tif
  #  - /all/tif/files/in/all/subdirectories/**/*.tif
  #  - /tif/or/jpeg/files/*.{tif,jpg}
  #
  includes:
    - valid_variants
    - invalid_images
    - inconsistent_colorspace
    - consecutive_numbering
    - numbering_gap

  # ---
  # Exclude Patterns
  #
  # List all directories or files that match an "includes" pattern, but are supposed to be ignored and not validated.
  # Patterns can be defined in the same way as describe for "includes" pattern.
  #
  # For Example:
  #
  # excludes:
  #  - /path/to/directory  # exclude a specific directory
  #  - **.jpg              # exclude jpg files in any subdirectories
  #
  excludes:

# ---
# Validation Options
#
validation:
  # ---
  # Parallel Execution Threads
  #
  # Specify the number of images that are validated in parallel (default 4). Only images of the same directory are validated in parallel.
  # Directories are processed one after another.
  #
  parallelThreads: 4

  # ---
  # Validation Rules for Directories
  #
  # The following options are used to determine whether a directory is considered valid or not. Even if no options are provided, a
  # directory is only considered valid if all images files contained in it are evalated as valid.
  #
  directoryRules:
    # ---
    # Consistent Properties by Directory
    #
    # Define a list of properties with JsonPath that are required to be consistent for all images within a directory.
    # If there are two images with different values for the same property, the validation of this directory fails.
    # Individual images may still be valid by themselves. Defaults to an empty list.
    #
    # For Example:
    #
    # consistentProperties:
    #   - $.exiftool.TIFF.IFD[0].PhotometricInterpretation
    #   - $.exiftool.TIFF.IFD[0].BitsPerSample
    #
    consistentProperties:
      - $.exiftool.TIFF.IFD[0].PhotometricInterpretation
      - $.exiftool.TIFF.IFD[0].BitsPerSample

    # ---
    # Consecutive Numbering of Files in a Directory
    #
    # Define a regular expression that is used to parse a unique number from a filename that can be checked for consecutiveness within a
    # directory. This check will verify that image files are numbered without gaps inside a directory, e.g. `000001.tif`, `000002.tif`,
    # etc. The regular expression needs to be defined in a way that the number contained in a filename is matched with a single
    # match group. For example, the regular expression `^(\d{6})\.tif$` defines a match group around a 6-digit number by adding
    # parentheses around this part of the filename. There can be multiple match groups if required. The match group number can be
    # specified (defaults to 1). By default, the first file in the directory must start with number 1.
    #
    # Regular Expression documentation:
    # https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/regex/Pattern.html
    #
    # For Example:
    #
    # consecutiveNumbering:
    #   filenameRegExp: ^(\d{6})\.tif$
    #   numberMatchGroup: 1
    #   startNumber: 1
    consecutiveNumbering:
      filenameRegExp: ^(\d{6})\.tif$
      numberMatchGroup: 1
      startNumber: 1

  imageRules:
    # JHove wellformed
    - message: JHove must detect file as wellformed
      severity: error
      context: $.jhove
      condition:
        property: $.wellformed
        assert: equal
        value: true

    # JHove valid
    - message: JHove must detect file as valid
      severity: error
      context: $.jhove
      condition:
        property: $.valid
        assert: equal
        value: true

    # Exiftool reports no warning
    - message: Exiftool reports warning
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Warning
          assert: exists

    # IFD
    - message: must have exactly one IFD
      severity: error
      context: $.exiftool
      condition:
        property: $.TIFF.IFD
        assert: occurrences
        value: 1

    # ImageWidth
    - message: ImageWidth must be positive integer
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.ImageWidth
            assert: greaterThan
            value: 0
          - property: $.ImageWidth
            assert: isInteger

    # ImageLength
    - message: ImageHeight must be positive integer
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.ImageHeight
            assert: greaterThan
            value: 0
          - property: $.ImageHeight
            assert: isInteger

    # PhotometricInterpretation
    - message: PhotometricInterpretation must be RGB or BlackIsZero
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.PhotometricInterpretation
        assert: oneOf
        value:
          - BlackIsZero
          - RGB

    # BitsPerSample
    - message: BitsPerSample must be all 8 or all 16
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.BitsPerSample
        assert: oneOf
        value:
          - "8"
          - "8 8 8"
          - "16"
          - "16 16 16"

    # Compression
    - message: Compression must be Uncompressed
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.Compression
        assert: equal
        value: Uncompressed

    # StripOffsets
    - message: StripOffsets must be positive integer
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.StripOffsets
            assert: greaterThan
            value: 0
          - property: $.StripOffsets
            assert: isInteger

    # RowsPerStrip
    - message: RowsPerStrip must be positive integer
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.RowsPerStrip
            assert: greaterThan
            value: 0
          - property: $.RowsPerStrip
            assert: isInteger

    # StripByteCounts
    - message: StripByteCounts must be positive integer
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        and:
          - property: $.StripByteCounts
            assert: greaterThan
            value: 0
          - property: $.StripByteCounts
            assert: isInteger

    # XResolution
    - message: XResolution must be either 300, 400 or 600
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.XResolution
        assert: oneOf
        value:
          - 300
          - 400
          - 600

    # YResolution
    - message: YResolution must be either 300, 400 or 600
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.YResolution
        assert: oneOf
        value:
          - 300
          - 400
          - 600

    # ResolutionUnit
    - message: ResolutionUnit must be inches
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.ResolutionUnit
        assert: equal
        value: inches

    # Make
    - message: Make must not be empty
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        not:
          property: $.Make
          assert: isEmpty

    # Model
    - message: Model must not be empty
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        not:
          property: $.Model
          assert: isEmpty

    # Software
    - message: Software must not be empty
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        not:
          property: $.Software
          assert: isEmpty

    # Artist
    - message: Artist must not be empty
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        not:
          property: $.Artist
          assert: isEmpty

    # ICC Profile
    - message: ICC profile required
      severity: error
      context: $.exiftool
      condition:
        property: $..ICC_Profile
        assert: occurrences
        value: 1

    # SerialNumber
    - message: SerialNumber required
      severity: error
      context: $.exiftool
      condition:
        or:
          - not:
              property: $..ExifIFD.SerialNumber
              assert: isEmpty
          - not:
              property: $..XMP.SerialNumber
              assert: isEmpty

    # SubfileType
    - message: SubfileType must be 'Full-resolution image' if defined
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.SubfileType
              assert: exists
          - property: $.SubfileType
            assert: equal
            value: Full-resolution image

    # FillOrder
    - message: FillOrder must be 'Normal' image if defined
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.FillOrder
              assert: exists
          - property: $.FillOrder
            assert: equal
            value: Normal

    # ImageDescription
    - message: ImageDescription must not be empty if defined
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.ImageDescription
              assert: exists
          - not:
              property: $.ImageDescription
              assert: isEmpty

    # Orientation
    - message: Orientation must be 'Horizontal (normal)' if defined
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.Orientation
              assert: exists
          - property: $.Orientation
            assert: equal
            value: Horizontal (normal)

    # SamplesPerPixel
    - message: SamplesPerPixel must be 1 or 3
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.SamplesPerPixel
        assert: oneOf
        value:
          - 1
          - 3

    # PlanarConfiguration
    - message: PlanarConfiguration must be 'Chunky' if defined
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.PlanarConfiguration
              assert: exists
          - property: $.PlanarConfiguration
            assert: equal
            value: Chunky

    # ModifyDate
    - message: ModifyDate must be formatted as 'YYYY:MM:DD HH:MM:SS' if defined
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        or:
          - not:
              property: $.ModifyDate
              assert: exists
          - property: $.ModifyDate
            assert: matches
            value: ^\d\d\d\d:\d\d:\d\d \d\d:\d\d:\d\d$

    # WhiteBalance
    - message: WhiteBalance must be Auto or Manual
      severity: error
      context: $.exiftool.TIFF.IFD[0]
      condition:
        property: $.WhiteBalance
        assert: oneOf
        value:
          - Auto
          - Manual

    # Copyright
    - message: Copyright must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Copyright
          assert: exists

    # XMP Rights
    - message: XMP Rights must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..XMP.Rights
          assert: exists

    # OldSubfileType
    - message: OldSubfileType must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..OldSubfileType
          assert: exists

    # Thresholding
    - message: Thresholding must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..Thresholding
          assert: exists

    # CellWidth
    - message: CellWidth must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..CellWidth
          assert: exists

    # CellLength
    - message: CellLength must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..CellLength
          assert: exists

    # FreeOffsets
    - message: FreeOffsets must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..FreeOffsets
          assert: exists

    # FreeByteCounts
    - message: FreeByteCounts must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..FreeByteCounts
          assert: exists

    # HostComputer
    - message: HostComputer must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..HostComputer
          assert: exists

    # ColorMap
    - message: ColorMap must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..ColorMap
          assert: exists

    # ExtraSamples
    - message: ExtraSamples must not be defined
      severity: error
      context: $.exiftool
      condition:
        not:
          property: $..ExtraSamples
          assert: exists

output:
  csv:
    path: output.csv
    columns:
      - label: JHove wellformed
        property: $.jhove.wellformed
      - label: JHove valid
        property: $.jhove.valid
      - label: Exiftool warning
        property: $.exiftool..Warning
      - label: Number of IFDs
        property: $.exiftool.TIFF.IFD.length()
      - label: ImageWidth
        property: $.exiftool.TIFF.IFD[0].ImageWidth
      - label: ImageHeight
        property: $.exiftool.TIFF.IFD[0].ImageHeight
      - label: PhotometricInterpretation
        property: $.exiftool.TIFF.IFD[0].PhotometricInterpretation
      - label: BitsPerSample
        property: $.exiftool.TIFF.IFD[0].BitsPerSample
      - label: Compression
        property: $.exiftool.TIFF.IFD[0].Compression
      - label: StripOffsets
        property: $.exiftool.TIFF.IFD[0].StripOffsets
      - label: RowsPerStrip
        property: $.exiftool.TIFF.IFD[0].RowsPerStrip
      - label: StripByteCounts
        property: $.exiftool.TIFF.IFD[0].StripByteCounts
      - label: XResolution
        property: $.exiftool.TIFF.IFD[0].XResolution
      - label: YResolution
        property: $.exiftool.TIFF.IFD[0].YResolution
      - label: ResolutionUnit
        property: $.exiftool.TIFF.IFD[0].ResolutionUnit
      - label: Make
        property: $.exiftool.TIFF.IFD[0].Make
      - label: Model
        property: $.exiftool.TIFF.IFD[0].Model
      - label: Software
        property: $.exiftool.TIFF.IFD[0].Software
      - label: Artist
        property: $.exiftool.TIFF.IFD[0].Artist
      - label: ICC Profile Description
        property: $.exiftool.TIFF.IFD[0].ICC_Profile.ProfileDescription
      - label: SerialNumber (ExifIFD)
        property: $.exiftool.TIFF.IFD[0].ExifIFD.SerialNumber
      - label: SerialNumber (XMP)
        property: $.exiftool.TIFF.IFD[0].XMP.SerialNumber
      - label: SubfileType
        property: $.exiftool.TIFF.IFD[0].SubfileType
      - label: FillOrder
        property: $.exiftool.TIFF.IFD[0].FillOrder
      - label: ImageDescription
        property: $.exiftool.TIFF.IFD[0].ImageDescription
      - label: Orientation
        property: $.exiftool.TIFF.IFD[0].Orientation
      - label: SamplesPerPixel
        property: $.exiftool.TIFF.IFD[0].SamplesPerPixel
      - label: PlanarConfiguration
        property: $.exiftool.TIFF.IFD[0].PlanarConfiguration
      - label: ModifyDate
        property: $.exiftool.TIFF.IFD[0].ModifyDate
      - label: WhiteBalance
        property: $.exiftool.TIFF.IFD[0].WhiteBalance
