input:
  excludes:
    - config.yaml
    - "**.csv"
    - "**.xlsx"
    - ".~lock*"
    - "**.sha1"
    - "**.gitignore"

validation:
  imageRules:
    # wellformed
    - message: JHove must detect file as wellformed
      severity: error
      context: $.jhove
      condition:
        property: $.wellformed
        assert: equal
        value: true

    # PhotometricInterpretation
    - message: PhotometricInterpretation should be RGB or BlackIsZero
      severity: warning
      context: $.exiftool
      condition:
        property: $..PhotometricInterpretation
        assert: oneOf
        value:
          - RGB
          - BlackIsZero

output:
  report:
    csv:
      path: ${date}_${time}_report_for_${inputBaseDirectoryName}.csv
      renderOnlyFirstListValue: true

    excel:
      path: ${date}_${time}_report_for_${inputBaseDirectoryName}.xlsx

    columns:
      - label: JHove wellformed
        property: $.jhove.wellformed
